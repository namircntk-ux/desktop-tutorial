<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pencarian Profil GitHub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Pencarian Profil GitHub</h1>
    <p class="subtitle">Cari dan temukan profil GitHub yang kamu inginkan!</p>

    <form id="searchForm">
      <input
        type="text"
        id="username"
        placeholder="Masukkan username GitHub"
        aria-label="Username GitHub"
        required
      />
      <button type="submit" id="searchButton">Cari</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="profilecard" class="profile-card" hidden>
      <img id="avatar" src="" alt="Foto profil GitHub" />
      <h2 id="name"></h2>
      <p id="login" class="login"></p>
      <p id="bio" class="bio"></p>

      <div class="repository">
        <span>Repository Publik</span>
        <strong id="public_repos">0</strong>
      </div>

      <a id="profileLink" href="#" target="_blank" rel="noopener noreferrer">
        Lihat Profil GitHub
      </a>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
